<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1526">
<title>Books</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header>
  <div class="logo">BOOKS<sup>M2</sup></div>
  <div class="sep"></div>
  <div class="hdr-book">
    <span id="book-title"></span>
    <span id="book-author"></span>
  </div>
  <div class="hdr-pick">
    <label class="hdr-pick-label" for="sort-select">Sort</label>
    <select id="sort-select" aria-label="Sort the library"></select>
  </div>
  <div class="search-wrap">
    <input type="search" id="search-input" placeholder="🔍 Search library…"
           autocomplete="off" spellcheck="false" aria-label="Search library">
  </div>
  <div class="hdr-right">
    <span id="chapter"></span>
    <span id="progress"></span> · <span id="status">Starting…</span>
  </div>
</header>

<div class="workspace">
  <div id="browser">
    <div class="browse-modes" id="browse-modes"></div>
    <div class="letter-bar" id="letter-bar" hidden></div>
    <button id="new-shelf" hidden>＋ New shelf</button>
    <button id="review-accept-all" hidden>✓ Accept all pending</button>
    <div class="browse-back" id="browse-back" hidden>
      <button class="back-link">← back</button>
      <span id="browse-back-title"></span>
    </div>
    <div id="book-list"><div class="msg">Loading library…</div></div>
    <div id="statusbar"></div>
  </div>

  <div id="reader">
    <button id="reader-back" aria-label="Back to the library">‹</button>
    <div id="detail" hidden>
      <div class="detail-head">
        <img id="detail-cover" alt="">
        <div class="detail-headings">
          <h1 id="detail-title"></h1>
          <div id="detail-series"></div>
          <div id="detail-author"></div>
          <div id="detail-facts"></div>
          <div class="detail-actions">
            <button class="btn primary" id="detail-read">▶ Read</button>
            <button class="btn" id="detail-shelf">＋ Shelf</button>
          </div>
        </div>
      </div>

      <section class="detail-panel">
        <h2>Synopsis</h2>
        <div id="detail-synopsis"></div>
      </section>

      <section class="detail-panel" id="detail-author-panel">
        <h2>About the author</h2>
        <div id="detail-bio"></div>
        <div id="detail-note" class="muted" hidden></div>
        <button class="btn" id="detail-lookup" hidden>Look this author up</button>
      </section>

      <section class="detail-panel">
        <h2>Also published
          <button class="link-btn" id="detail-showall" hidden></button>
        </h2>
        <div id="detail-also"></div>
      </section>
    </div>

    <div id="review" hidden>
      <div class="review-head">
        <h1 id="review-title"></h1>
        <div id="review-score"></div>
      </div>
      <section class="detail-panel">
        <h2>Why this score</h2>
        <div id="review-parts"></div>
      </section>
      <section class="detail-panel">
        <h2>What would change</h2>
        <div id="review-changes"></div>
      </section>
      <div class="detail-actions">
        <button class="btn primary" id="review-accept">✓ Accept</button>
        <button class="btn" id="review-reject">✕ Reject</button>
      </div>
    </div>

    <div id="reader-stage" data-state="empty">
      <!-- ReaderEngine appends a foliate-view here on open. -->
    </div>

    <div id="loading" data-phase="idle" aria-live="polite" hidden>
      <div class="loading-book no-cover">
        <div class="loading-face loading-front">
          <img class="loading-cover" alt="">
        </div>
        <div class="loading-face loading-back" aria-hidden="true"></div>
      </div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
      <div class="loading-label">Downloading 0%</div>
    </div>
    <div class="controls">
      <button class="btn" id="btn-prev">‹ Prev</button>
      <button class="btn" id="btn-panels" aria-label="Contents, highlights and display">Aa</button>
      <button class="btn" id="btn-shelf">＋ Shelf</button>
      <button class="btn" id="btn-next">Next ›</button>
    </div>

    <div id="shelf-sheet" hidden>
      <div class="sheet-head">
        <span>Put this book on…</span>
        <button class="btn" id="shelf-close">Done</button>
      </div>
      <div id="shelf-choices"></div>
      <button class="btn" id="shelf-new">＋ New shelf</button>
    </div>
  </div>

  <div id="selection-menu" hidden>
    <button type="button" id="selection-highlight">Highlight</button>
    <button type="button" id="selection-note">Note</button>
    <button type="button" id="selection-copy">Copy</button>
    <span class="selection-inks">
      <button type="button" class="ink" data-color="yellow" aria-label="Yellow"></button>
      <button type="button" class="ink" data-color="green" aria-label="Green"></button>
      <button type="button" class="ink" data-color="blue" aria-label="Blue"></button>
      <button type="button" class="ink" data-color="pink" aria-label="Pink"></button>
    </span>
  </div>

  <div id="note-editor" hidden>
    <textarea id="note-text" rows="3" placeholder="What about this passage?"
              aria-label="Note"></textarea>
    <div class="note-actions">
      <button type="button" id="note-cancel">Cancel</button>
      <button type="button" id="note-save" class="primary">Save</button>
    </div>
  </div>

  <div id="side">
    <button id="panels-close" aria-label="Close">✕</button>
    <div class="tab-bar">
      <button class="tab active" id="tab-toc">Contents</button>
      <button class="tab" id="tab-marks">Highlights</button>
      <button class="tab" id="tab-display">Display</button>
    </div>

    <div id="panel-toc" class="panel">
      <div id="toc-list"></div>
    </div>

    <div id="panel-marks" class="panel" hidden>
      <div id="marks-list"></div>
    </div>

    <div id="panel-display" class="panel" hidden>
      <div class="field">
        <label for="theme-select">Theme</label>
        <select id="theme-select">
          <option value="light">Light</option>
          <option value="sepia">Sepia</option>
          <option value="dark">Dark</option>
          <option value="black">Black</option>
        </select>
      </div>

      <div class="field">
        <label for="font-select">Typeface</label>
        <select id="font-select">
          <option value="default">As published</option>
          <option value="serif">Serif</option>
          <option value="sans">Sans</option>
          <option value="mono">Monospace</option>
        </select>
      </div>

      <div class="field">
        <label>Text size</label>
        <div class="stepper">
          <button class="btn" id="font-smaller" aria-label="Smaller text">−</button>
          <span id="font-size-value">100%</span>
          <button class="btn" id="font-bigger" aria-label="Larger text">+</button>
        </div>
      </div>

      <div class="field">
        <label for="line-height">Line spacing</label>
        <input type="range" id="line-height" min="1" max="2.4" step="0.1">
      </div>

      <div class="field">
        <label for="flow-select">Flow</label>
        <select id="flow-select">
          <option value="paginated">Paginated</option>
          <option value="scrolled">Scrolled</option>
        </select>
      </div>

      <div class="field">
        <label for="column-select">Columns</label>
        <select id="column-select">
          <option value="1">One</option>
          <option value="2">Two</option>
        </select>
      </div>

      <p class="field-note">
        Display settings are kept on this device. Your place in a book is
        kept on the server and shared with every device.
      </p>
    </div>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
